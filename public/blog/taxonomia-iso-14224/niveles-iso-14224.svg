<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 652" font-family="Inter,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="505" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Los 9 niveles de la taxonomía ISO 14224</text>
<rect x="40" y="60" width="720" height="52" rx="6" fill="#1e3a8a"/>
<text x="58" y="82" font-size="15" font-weight="700" fill="#fff">1 · Industria</text>
<text x="58" y="102" font-size="13" fill="#e5e7eb">Ej.: Petróleo y gas</text>
<rect x="64" y="118" width="672" height="52" rx="6" fill="#1e3a8a"/>
<text x="82" y="140" font-size="15" font-weight="700" fill="#fff">2 · Categoría de negocio</text>
<text x="82" y="160" font-size="13" fill="#e5e7eb">Ej.: Upstream</text>
<rect x="88" y="176" width="624" height="52" rx="6" fill="#1e3a8a"/>
<text x="106" y="198" font-size="15" font-weight="700" fill="#fff">3 · Instalación</text>
<text x="106" y="218" font-size="13" fill="#e5e7eb">Ej.: Estación de compresión Norte</text>
<rect x="112" y="234" width="576" height="52" rx="6" fill="#1e3a8a"/>
<text x="130" y="256" font-size="15" font-weight="700" fill="#fff">4 · Planta / unidad</text>
<text x="130" y="276" font-size="13" fill="#e5e7eb">Ej.: Tren de compresión 1</text>
<rect x="136" y="292" width="528" height="52" rx="6" fill="#1e3a8a"/>
<text x="154" y="314" font-size="15" font-weight="700" fill="#fff">5 · Sección / sistema</text>
<text x="154" y="334" font-size="13" fill="#e5e7eb">Ej.: Compresión de gas</text>
<rect x="160" y="350" width="480" height="52" rx="6" fill="#f59e0b"/>
<text x="178" y="372" font-size="15" font-weight="700" fill="#fff">6 · Unidad de equipo</text>
<text x="178" y="392" font-size="13" fill="#e5e7eb">Ej.: Compresor K-101 (clase CO)</text>
<rect x="184" y="408" width="432" height="52" rx="6" fill="#2563eb"/>
<text x="202" y="430" font-size="15" font-weight="700" fill="#fff">7 · Subunidad</text>
<text x="202" y="450" font-size="13" fill="#e5e7eb">Ej.: Sistema de lubricación</text>
<rect x="208" y="466" width="384" height="52" rx="6" fill="#2563eb"/>
<text x="226" y="488" font-size="15" font-weight="700" fill="#fff">8 · Componente / ítem mantenible</text>
<text x="226" y="508" font-size="13" fill="#e5e7eb">Ej.: Bomba de aceite</text>
<rect x="232" y="524" width="336" height="52" rx="6" fill="#2563eb"/>
<text x="250" y="546" font-size="15" font-weight="700" fill="#fff">9 · Parte</text>
<text x="250" y="566" font-size="13" fill="#e5e7eb">Ej.: Sello mecánico</text>
<path d="M778 60 h14 v284 h-14" fill="none" stroke="#374151" stroke-width="2"/>
<text x="800" y="198.0" font-size="13" font-weight="700" fill="#111827">Uso / ubicación</text>
<text x="800" y="216.0" font-size="12" fill="#4b5563">(dónde y para qué)</text>
<path d="M778 350 h14 v226 h-14" fill="none" stroke="#374151" stroke-width="2"/>
<text x="800" y="459.0" font-size="13" font-weight="700" fill="#111827">Subdivisión del equipo</text>
<text x="800" y="477.0" font-size="12" fill="#4b5563">(qué es y de qué está hecho)</text>
<rect x="60" y="594" width="14" height="14" fill="#f59e0b"/><text x="82" y="606" font-size="13" fill="#374151">Nivel 6: aquí se asigna la clase de equipo y se calculan tasa de falla, MTBF y disponibilidad.</text>
</svg>