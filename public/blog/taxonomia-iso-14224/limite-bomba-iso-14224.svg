<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter,Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
<text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Límite de una bomba (clase PU) según ISO 14224</text>
<rect x="300" y="70" width="640" height="420" rx="14" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="12 8"/>
<text x="320" y="98" font-size="14" font-weight="700" fill="#1e3a8a">Dentro del límite: unidad de equipo P-201A (nivel 6)</text>
<rect x="330" y="120" width="280" height="70" rx="8" fill="#2563eb"/><text x="470.0" y="149.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Transmisión de potencia</text><text x="470.0" y="169.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".85">acople, caja de engranes</text>
<rect x="640" y="120" width="280" height="70" rx="8" fill="#2563eb"/><text x="780.0" y="149.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Unidad de bomba</text><text x="780.0" y="169.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".85">carcasa, impulsor, sellos, rodamientos</text>
<rect x="330" y="215" width="280" height="70" rx="8" fill="#2563eb"/><text x="470.0" y="244.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Control y monitoreo</text><text x="470.0" y="264.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".85">instrumentos y sensores propios</text>
<rect x="640" y="215" width="280" height="70" rx="8" fill="#2563eb"/><text x="780.0" y="244.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Sistema de lubricación</text><text x="780.0" y="264.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".85">aceite, bomba, filtros</text>
<rect x="330" y="310" width="280" height="70" rx="8" fill="#2563eb"/><text x="470.0" y="339.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Enfriamiento / calefacción</text><text x="470.0" y="359.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".85">si la bomba lo tiene</text>
<rect x="640" y="310" width="280" height="70" rx="8" fill="#2563eb"/><text x="780.0" y="339.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Misceláneos</text><text x="780.0" y="359.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".85">base, cubiertas, otros</text>
<text x="620" y="420" text-anchor="middle" font-size="13" fill="#1e3a8a">Subunidades (nivel 7). Debajo de cada una van los ítems mantenibles (nivel 8).</text>
<rect x="40" y="130" width="210" height="90" rx="8" fill="#f59e0b"/><text x="145.0" y="169.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Motor eléctrico</text><text x="145.0" y="189.0" text-anchor="middle" font-size="12" fill="#111827" opacity=".85">clase EM · otra unidad</text>
<text x="145" y="245" text-anchor="middle" font-size="12" fill="#92400e">Accionador: fuera del límite,</text><text x="145" y="261" text-anchor="middle" font-size="12" fill="#92400e">con su propio historial de fallas</text>
<line x1="250" y1="165" x2="326" y2="155" stroke="#374151" stroke-width="2.5" marker-end="url(#f)"/>
<rect x="40" y="330" width="210" height="60" rx="8" fill="#9ca3af"/><text x="145.0" y="354.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Alimentación eléctrica</text><text x="145.0" y="374.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".85">fuera del límite</text>
<line x1="250" y1="360" x2="326" y2="250" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#f)"/>
<text x="40" y="520" font-size="13" fill="#374151">Entrada →</text><line x1="110" y1="516" x2="326" y2="460" stroke="#374151" stroke-width="2" marker-end="url(#f)"/>
<line x1="940" y1="460" x2="985" y2="520" stroke="#374151" stroke-width="2" marker-end="url(#f)"/><text x="935" y="512" text-anchor="end" font-size="13" fill="#374151">Salida →</text>
<text x="500" y="552" text-anchor="middle" font-size="12" fill="#6b7280">Las válvulas de entrada y salida y la tubería de proceso quedan fuera del límite. Esquema simplificado de ReliaPlant basado en el Anexo A de ISO 14224:2016.</text>
</svg>