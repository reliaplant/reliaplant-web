<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter,Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
<text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">El ciclo de una orden de trabajo en un GMAO / CMMS</text>
<rect x="40" y="80" width="190" height="96" rx="10" fill="#1e3a8a"/>
<text x="135" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Aviso</text>
<text x="135" y="144" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".9">reporte de falla o anomalía</text>
<rect x="290" y="80" width="190" height="96" rx="10" fill="#1e3a8a"/>
<text x="385" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Aprobación</text>
<text x="385" y="144" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".9">aceptar, rechazar o duplicado</text>
<rect x="540" y="80" width="190" height="96" rx="10" fill="#2563eb"/>
<text x="635" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Orden de trabajo</text>
<text x="635" y="144" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".9">tareas, horas y materiales</text>
<rect x="790" y="80" width="190" height="96" rx="10" fill="#2563eb"/>
<text x="885" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Programación</text>
<text x="885" y="144" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".9">semana, cuadrilla y parada</text>
<rect x="790" y="250" width="190" height="96" rx="10" fill="#2563eb"/>
<text x="885" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Ejecución</text>
<text x="885" y="314" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".9">en campo, desde el celular</text>
<rect x="540" y="250" width="190" height="96" rx="10" fill="#f59e0b"/>
<text x="635" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Cierre técnico</text>
<text x="635" y="314" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".9">modo, causa, acción, horas reales</text>
<rect x="290" y="250" width="190" height="96" rx="10" fill="#059669"/>
<text x="385" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Historial y KPI</text>
<text x="385" y="314" text-anchor="middle" font-size="11.5" fill="#fff" opacity=".9">MTBF, MTTR, backlog, costos</text>
<line x1="232" y1="128" x2="286" y2="128" stroke="#374151" stroke-width="2.5" marker-end="url(#f)"/>
<line x1="482" y1="128" x2="536" y2="128" stroke="#374151" stroke-width="2.5" marker-end="url(#f)"/>
<line x1="732" y1="128" x2="786" y2="128" stroke="#374151" stroke-width="2.5" marker-end="url(#f)"/>
<line x1="885" y1="178" x2="885" y2="246" stroke="#374151" stroke-width="2.5" marker-end="url(#f)"/>
<line x1="788" y1="298" x2="734" y2="298" stroke="#374151" stroke-width="2.5" marker-end="url(#f)"/>
<line x1="538" y1="298" x2="484" y2="298" stroke="#374151" stroke-width="2.5" marker-end="url(#f)"/>
<path d="M290 298 H150 V182" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f)"/>
<text x="160" y="232" font-size="12" fill="#065f46">el historial mejora</text><text x="160" y="248" font-size="12" fill="#065f46">los planes y la prioridad</text>
<rect x="40" y="380" width="920" height="60" rx="8" fill="#fef3c7"/>
<text x="500" y="405" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">El paso que decide si el GMAO sirve: el cierre técnico.</text>
<text x="500" y="426" text-anchor="middle" font-size="12.5" fill="#92400e">Sin modo y causa de falla codificados, el historial no permite calcular MTBF ni encontrar fallas repetitivas.</text>
</svg>